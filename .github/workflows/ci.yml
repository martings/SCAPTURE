name: SCAPTURE CI & OCI

on:
  push:
    branches: [main, master, feat/*]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image and run CLI suite
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scapture:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run strand CLI and determinism tests
        run: docker run --rm scapture:test bash /opt/scapture/tests/test_strand_cli.sh

  oci-image:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/scapture
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value={{sha}}

      - name: Build and push OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
